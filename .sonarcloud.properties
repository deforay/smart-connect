# SonarQube Cloud automatic analysis settings.
#
# Rules are chosen in the "deforay" organization's quality profiles, not here;
# this file only decides which files are analysed.

sonar.sourceEncoding=UTF-8

# Third-party libraries, the Metronic theme, generated output, and SQL.
# Released migrations are never edited, and MySQL files are checked against
# PL/SQL rules that do not fit them. deforayModal.js is our own and stays in.
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/assets/global/css/**,\
  public/assets/global/plugins/**,\
  public/assets/global/img/**,\
  public/assets/global/scripts/Chart.min.js,\
  public/assets/global/scripts/app*.js,\
  public/assets/global/scripts/datatable*.js,\
  public/assets/global/scripts/highchart*.js,\
  public/assets/global/scripts/maplace.min.js,\
  public/assets/plugins/**,\
  public/assets/layouts/**,\
  public/assets/pages/**,\
  public/assets/bootstrap-toggle/**,\
  public/assets/js/highcharts*.js,\
  public/assets/js/jasny-bootstrap.min.js,\
  **/*.min.js,\
  **/*.min.css,\
  **/*.sql,\
  dev/**,\
  docs/**
