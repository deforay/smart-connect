site_name: Smart Connect Documentation
site_description: API reference, integration guides, and operations runbooks for Smart Connect
site_url: https://deforay.github.io/smart-connect/
repo_url: https://github.com/deforay/smart-connect
repo_name: deforay/smart-connect

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# Keep this list and the one in docs/index.md in the same order. They are the
# site's two tables of contents and they drift apart if edited separately.
nav:
  - Home: index.md
  - Connecting a LIS:
      - Connect a LIS to Smart Connect: guides/connecting-a-lis.md
      - Manage the enrollment key: guides/enrollment-key.md
  - Operations:
      - Retire the legacy API: guides/retiring-the-legacy-api.md
  - Reference:
      - API v2: api/index.md
  - Explanation:
      - Why API v2 looks like this: explanation/api-v2-design.md

# The original build plan (internal/api-v2-plan.md) stays in the repository as a
# record of the design discussion, but it is deliberately not published. Parts of
# it were dropped during implementation and a published plan that contradicts the
# shipped API is worse than no plan at all.
not_in_nav: |
  internal/*

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/smart-connect
