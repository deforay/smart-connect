site_name: Smart Connect Documentation
site_description: API reference, integration guides, and operations runbooks for Smart Connect
site_url: https://deforay.github.io/smart-connect/
repo_url: https://github.com/deforay/smart-connect
repo_name: deforay/smart-connect

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# Keep this list and the one in docs/index.md in the same order. They are the
# site's two tables of contents and they drift apart if edited separately.
nav:
  - Home: index.md
  - Connecting a LIS:
      - Connect a LIS to Smart Connect: guides/connecting-a-lis.md
      - Manage the enrollment key: guides/enrollment-key.md
  - Reference:
      - API: api/index.md

# docs/internal holds material written for whoever maintains Smart Connect
# itself: the original build plan, and the one-time runbook for retiring the
# pre-1.2.0 endpoints. Country teams operate the dashboard and connect
# laboratories to it. They never used the endpoints being retired, so that
# history is noise on the published site.
not_in_nav: |
  internal/*

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/deforay/smart-connect
