name: Deploy Docs

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least-privilege default for all jobs. The deploy job grants itself the write
# scopes it needs, which keeps Pages write off the build job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      # Action majors are kept current so their JavaScript runs on the Node
      # version they declare. An action pinned to node20 still runs, but the
      # runner forces it onto node24 and annotates every build.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # --strict turns broken internal links into build failures, so a renamed
      # page cannot ship a dead nav entry.
      - name: Build site
        run: mkdocs build --strict

      # v5 is the first release whose bundled actions/upload-artifact is on
      # node24. v4 still pins upload-artifact 4.6.2, which is not.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
